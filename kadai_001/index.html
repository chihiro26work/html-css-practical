<!DOCTYPE html>
<html>
  <head>
    <title>MY PROFILE</title>
    <meta charset="UTF8">
    <meta name="description" content="プロフィールの紹介です。">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP&display=swap" rel="stylesheet">  </head>

  <body>
    <header>
      <div id="header-nav">
        <h1>
          <a id="header-pro" href="index.html">My Profile</a>
        </h1>
        <nav>
          <ul>
            <li class="nav-li"><a href="index.html#about">About</a></li>
            <li class="nav-li"><a href="index.html#works">Works</a></li>
          </ul>
        </nav>
      </div>
    </header>

    <main>
      <article>
        <!-- メインヴィジュアル -->
        <section id="mv">
          <div>
            <img src="images/main.png" alt="カメラの画像">
          </div>
        </section>

        <!-- アバウト -->
        <section id="about">
          <div>
            <h2>About</h2>
            <div id="about-content">
              <img src="images/about.png" alt="横顔写真">
              <div>
                <h3>Kazuki Asahina</h3>
                <ul>
                  <li>25歳 長野県佐久市出身</li>
                  <li>ソフトウェア業界でマーケティングに従事</li>
                  <li>趣味はカメラ、愛機はCanon</li>
                  <li>自然を撮影するのが好きで、海や山によく行く</li>
                </ul>
              </div>
            </div>
          </div>
        </section>

        <!-- ワークス -->
        <section id="works">
          <div>
            <h2>Works</h2>
            <div id="works-content">
              <div>
                <img src="images/works1.png" alt="海の画像">
                <p>新潟に訪れた際に、日本海の雄大さに魅了されて撮影した1枚</p>
              </div>
              <div>
                <img src="images/works2.png" alt="雪山の写真">
                <p>地元長野の木曽町から撮影した、冠雪した御嶽山</p>
              </div>
              <div>
                <img src="images/works3.png" alt="京都の街並み">
                <p>京都で撮影した、明け方の古き良き日本の町並み</p>
              </div>
            </div>
          </div>
        </section> 
      </article>
    </main>

    <footer>
      <p>&copy; MyProfile. All rights reserved.</p>
    </footer>
  </body>
</html>
